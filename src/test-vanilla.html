<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米SU7网站特效复刻 - Vanilla版本</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #sketch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .loader-screen {
            position: fixed;
            z-index: 5;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: 0.3s;
            background: black;
        }
        
        .hollow {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .loading {
            color: white;
            font-size: 1.875rem;
            letter-spacing: 0.1em;
        }
        
        .loading span {
            animation: blur 1.5s calc(var(--i) / 5 * 1s) alternate infinite;
        }
        
        @keyframes blur {
            to {
                filter: blur(2px);
            }
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sketch"></div>
        <div class="loader-screen">
            <div class="loading-container">
                <div class="loading">
                    <span style="--i: 0">L</span>
                    <span style="--i: 1">O</span>
                    <span style="--i: 2">A</span>
                    <span style="--i: 3">D</span>
                    <span style="--i: 4">I</span>
                    <span style="--i: 5">N</span>
                    <span style="--i: 6">G</span>
                </div>
            </div>
        </div>
        
        <div class="info">
            <strong>小米SU7网站特效复刻</strong><br>
            基于 Three.js + kokomi.js<br>
            复刻小米SU7官网的3D特效
        </div>
        
        <div class="controls">
            <strong>操作说明：</strong><br>
            • 鼠标拖拽：旋转视角<br>
            • 滚轮：缩放<br>
            • 点击汽车：触发加速特效<br>
            • URL添加 #furina：启用Furina模式<br>
            • URL添加 #debug：显示调试界面
        </div>
    </div>
    
    <script type="module">
        console.log('🚗 小米SU7网站特效复刻 - Vanilla版本');
        console.log('📝 使用说明：');
        console.log('   1. 等待资源加载完成');
        console.log('   2. 观看入场动画');
        console.log('   3. 点击汽车触发加速特效');
        console.log('   4. 使用鼠标控制视角');
        
        // 这里应该导入并启动ExperienceVanilla
        // 由于这是一个示例文件，实际的导入需要在构建系统中进行
        
        // 显示提示信息
        setTimeout(() => {
            const info = document.createElement('div');
            info.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(38, 214, 233, 0.9);
                color: white;
                padding: 20px;
                border-radius: 10px;
                text-align: center;
                z-index: 10000;
                font-size: 16px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            `;
            info.innerHTML = `
                <strong>🎉 Vanilla版本已准备就绪</strong><br><br>
                请使用开发服务器运行以查看完整效果<br>
                <small style="opacity: 0.8;">此为静态演示页面</small>
            `;
            document.body.appendChild(info);
            
            setTimeout(() => {
                info.style.opacity = '0';
                info.style.transition = 'opacity 1s';
                setTimeout(() => info.remove(), 1000);
            }, 3000);
        }, 1000);
    </script>
</body>
</html>
